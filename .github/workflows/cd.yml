name: cd

on:
  push:
    branches: [main, master]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECS_CLUSTER: shrinkr-cluster1
  API_SERVICE: shrinkr-api-service
  WORKER_SERVICE: shrinkr-worker-service-ejdebfpj

jobs:
  deploy-backend:
    name: build, push, and deploy backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.service }} image
        run: |
          ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          IMAGE_SHA="$ECR_REGISTRY/shrinkr/${{ matrix.service }}:${GITHUB_SHA::7}"
          IMAGE_LATEST="$ECR_REGISTRY/shrinkr/${{ matrix.service }}:latest"

          docker build --platform linux/amd64 \
            -t "$IMAGE_SHA" \
            -t "$IMAGE_LATEST" \
            -f "${{ matrix.service }}/Dockerfile" \
            "${{ matrix.service }}"

          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"

  deploy-ecs:
    name: force ECS deployments
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new ECS deployments
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$API_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION" >/dev/null

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$WORKER_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION" >/dev/null
