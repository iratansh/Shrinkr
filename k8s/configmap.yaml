apiVersion: v1
kind: ConfigMap
metadata:
  name: shrinkr-config
data:
  HTTP_PORT: "8080"
  REDIS_ADDR: "redis:6379"
  AWS_REGION: "us-east-1"
  SQS_ENDPOINT: "http://localstack:4566"
  BASE_SHORT_URL: "http://localhost:30080"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
  SHORT_CODE_BYTES: "6"
  SQS_BATCH_SIZE: "10"
  SQS_WAIT_TIME_SECONDS: "20"
