image:
  registry: docker.io
  repository: shrinkr
  pullPolicy: IfNotPresent
  tag: latest

api:
  replicaCount: 2
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

worker:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi

config:
  httpPort: "8080"
  redisAddr: "redis:6379"
  awsRegion: "us-east-1"
  sqsEndpoint: "http://localstack:4566"
  baseShortUrl: "http://localhost:30080"
  corsAllowedOrigins: "http://localhost:5173,http://127.0.0.1:5173"
  shortCodeBytes: "6"
  sqsBatchSize: "10"
  sqsWaitTimeSeconds: "20"

secrets:
  postgresDsn: "postgres://shrinkr:shrinkr@postgres:5432/shrinkr?sslmode=disable"
  redisPassword: ""
  sqsQueueUrl: "http://localstack:4566/000000000000/shrinkr-clicks"
  awsAccessKeyId: "test"
  awsSecretAccessKey: "test"

localDependencies:
  enabled: true
  postgres:
    image: postgres:16-alpine
    storage: 1Gi
  redis:
    image: redis:7-alpine
    storage: 1Gi
  localstack:
    image: localstack/localstack:3
