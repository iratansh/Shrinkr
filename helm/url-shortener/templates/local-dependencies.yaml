{{- if .Values.localDependencies.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.localDependencies.postgres.image }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: shrinkr
            - name: POSTGRES_PASSWORD
              value: shrinkr
            - name: POSTGRES_DB
              value: shrinkr
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.localDependencies.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.localDependencies.redis.image }}
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.localDependencies.redis.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  labels:
    app: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: {{ .Values.localDependencies.localstack.image }}
          ports:
            - containerPort: 4566
              name: edge
          env:
            - name: SERVICES
              value: sqs
            - name: DEFAULT_REGION
              value: {{ .Values.config.awsRegion | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
spec:
  selector:
    app: localstack
  ports:
    - name: edge
      port: 4566
      targetPort: 4566
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "url-shortener.fullname" . }}-localstack-sqs
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-queue
          image: amazon/aws-cli:2.15.57
          env:
            - name: AWS_ACCESS_KEY_ID
              value: test
            - name: AWS_SECRET_ACCESS_KEY
              value: test
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.config.awsRegion | quote }}
          command:
            - /bin/sh
            - -c
            - |
              until aws --endpoint-url=http://localstack:4566 sqs list-queues >/dev/null 2>&1; do
                sleep 2
              done
              aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name shrinkr-clicks
{{- end }}
